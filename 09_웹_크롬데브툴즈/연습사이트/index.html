<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>들꽃상점 - 동네 꽃집</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🌼 들꽃상점</h1>
  <p>동네 골목의 작은 꽃집이에요. (연습용 가짜 사이트)</p>
  <p class="open">오늘 영업시간: <span id="open-time">불러오는 중…</span></p>
</header>

<section class="hero">
  <img src="images/hero-big.png" alt="꽃이 가득한 가게 안 풍경" width="320">
</section>

<section class="event-banner">
  🎉 이번 주 행사: 꽃다발 2개 사면 작은 화분 1개 무료! 자세한 내용은 매장에 문의해 주세요~~~~~~~~
</section>

<main class="flowers">
  <article class="flower">
    <img src="images/tulip.png" alt="분홍 튤립 꽃다발">
    <h2>튤립 꽃다발</h2>
    <p class="price">15,000원</p>
  </article>
  <article class="flower">
    <img src="images/daisy.png">
    <h2>데이지 한 묶음</h2>
    <p class="price">9,000원</p>
  </article>
  <article class="flower">
    <img src="images/lavendar.png" alt="보라색 라벤더 화분">
    <h2>라벤더 화분</h2>
    <p class="price">12,000원</p>
  </article>
</main>

<footer>
  <p>주소: 가상시 연습구 들꽃길 12 · 이 사이트의 가게·가격은 모두 지어낸 것이에요.</p>
</footer>
<script src="app.js"></script>
</body>
</html>
