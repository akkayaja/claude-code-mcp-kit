<!DOCTYPE html>

<head>

<body>
  <header>
    <p class="badge">연습용 가짜 사이트예요</p>

  <main>

        <li><h3>4주 정규반</h3><p>주 1회 · 160,000원</p></li>
      </ul>

    <section>
      <h2>오시는 길</h2>
      <p>가상동 123번지 1층 (연습용 가짜 주소)</p>
      <p>화~토 11:00 ~ 19:00 · 일·월 휴무</p>
    </section>

    <section>
      <h2>예약 문의</h2>
      <p>예약은 공방 SNS 메시지로 받아요. (이 사이트에는 연락처를 적지 않아요)</p>
    </section>
  </main>

  <footer>
    <p id="version">버전 1</p>
  </footer>
